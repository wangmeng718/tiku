<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 手机自适应关键标签 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>电力题库刷题系统</title>
    <!-- 引入Tailwind移动端样式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        right: '#22c55e',
                        wrong: '#ef4444',
                        primary: '#165dff'
                    }
                }
            }
        }
    </script>
    <style>
        .option-btn {
    transition: all 0.2s ease;
}
/* 点击选中立刻高亮蓝色 */
.option-selected{
    background-color:#165dff !important;
    color:#ffffff !important;
    border-color:#165dff !important;
}
.option-correct {
    background-color: #22c55e !important;
    color: white !important;
    border-color: #22c55e !important;
}
.option-error {
    background-color: #ef4444 !important;
    color: white !important;
    border-color: #ef4444 !important;
}
.hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-2xl mx-auto px-3 py-4">
        <!-- 首页选择模式 -->
        <div id="home-page" class="space-y-4 mt-10">
            <h1 class="text-2xl font-bold text-center text-primary mb-8">电力安全题库学习系统</h1>
            <div class="grid gap-4">
                <button onclick="startMode('order')" class="w-full py-4 rounded-lg bg-primary text-white text-lg font-medium shadow-md">
                    模式1：顺序刷题（全部550题按顺序）
                </button>
                <button onclick="startMode('random100')" class="w-full py-4 rounded-lg bg-primary text-white text-lg font-medium shadow-md">

                </button>
                <div class="border rounded-lg p-4 bg-white shadow">
                    <h3 class="font-bold mb-3 text-gray-700">模式3：专题刷题</h3>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="startMode('single')" class="py-3 rounded bg-blue-100 text-primary font-medium">单选题</button>
                        <button onclick="startMode('multi')" class="py-3 rounded bg-blue-100 text-primary font-medium">多选题</button>
                        <button onclick="startMode('judge')" class="py-3 rounded bg-blue-100 text-primary font-medium">判断题</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 刷题页面 -->
        <div id="quiz-page" class="hidden">
            <!-- 顶部计时栏 -->
            <div class="sticky top-0 bg-white shadow p-3 rounded-lg mb-4 flex justify-between items-center">
                <span id="mode-title" class="font-bold text-primary">刷题中</span>
                <span id="timer" class="text-red-500 font-mono text-lg">00:00</span>
            </div>
            <!-- 题号 -->
            <div class="text-gray-500 mb-2">第 <span id="current-no">1</span> / <span id="total-no">0</span> 题</div>
            <!-- 题干 -->
            <div class="bg-white rounded-lg p-4 shadow mb-4">
                <h2 id="question-text" class="text-base leading-relaxed"></h2>
            </div>
            <!-- 选项区域 -->
            <div id="options-box" class="space-y-3 mb-4"></div>
            <!-- 操作按钮 -->
            <div class="flex gap-3 mb-4">
                <button id="submit-btn" onclick="submitAnswer()" class="flex-1 py-3 rounded-lg bg-primary text-white font-medium">确认答案</button>
                <button id="next-btn" onclick="nextQuestion()" class="flex-1 py-3 rounded-lg bg-gray-400 text-white font-medium hidden">下一题</button>
            </div>
            <!-- 答案解析区域（默认隐藏） -->
            <div id="answer-box" class="hidden bg-gray-50 border rounded-lg p-4 space-y-3">
                <div><span class="font-bold">正确答案：</span><span id="real-answer"></span></div>
                <div><span class="font-bold">解析：</span><p id="explain-text" class="text-gray-700 mt-1"></p></div>
            </div>
            <!-- 交卷按钮（仅模考模式显示） -->
            <button id="end-exam-btn" onclick="endExam()" class="w-full mt-4 py-3 rounded-lg bg-orange-500 text-white hidden">交卷出分</button>
            <!-- 返回首页 -->
            <button onclick="backHome()" class="w-full mt-4 py-3 rounded-lg bg-gray-200 text-gray-700">返回首页</button>
        </div>

        <!-- 模考成绩页面 -->
        <div id="score-page" class="hidden mt-20 text-center">
            <h2 class="text-3xl font-bold text-primary mb-4">考试结束</h2>
            <div class="text-xl mb-2">总分：<span id="final-score" class="text-red-500 font-bold">0</span> / 100</div>
            <div class="text-gray-600 mb-8">用时：<span id="cost-time"></span></div>
            <button onclick="backHome()" class="px-8 py-3 rounded-lg bg-primary text-white">返回首页</button>
        </div>
    </div>

        // 启动刷题模式
        function startMode(mode) {
            // 重置所有状态
            currentIndex = 0;
            timeSecond = 0;
            correctCount = 0;
            userSelect = [];
            examMode = false;
            clearInterval(timerInterval);
            quizList = [];

            // 根据模式筛选题目
            const singleList = allQuestions.filter(q => q['题型'] === '单选题');
            const multiList = allQuestions.filter(q => q['题型'] === '多选题');
            const judgeList = allQuestions.filter(q => q['题型'] === '判断题');

            switch(mode) {
                case 'order':
                    quizList = [...allQuestions];
                    document.getElementById('mode-title').innerText = '顺序刷题';
                    break;
                case 'random100':
                    examMode = true;
                    document.getElementById('mode-title').innerText = '模拟考试（100题）';
                    // 4:3:3 单选40 多选30 判断30
                    quizList = randomPick(singleList,40)
                                .concat(randomPick(multiList,30))
                                .concat(randomPick(judgeList,30));
                    // 打乱顺序
                    quizList.sort(() => Math.random() - 0.5);
                    break;
                case 'single':
                    quizList = [...singleList];
                    document.getElementById('mode-title').innerText = '单选题专题';
                    break;
                case 'multi':
                    quizList = [...multiList];
                    document.getElementById('mode-title').innerText = '多选题专题';
                    break;
                case 'judge':
                    quizList = [...judgeList];
                    document.getElementById('mode-title').innerText = '判断题专题';
                    break;
            }

            // 切换页面
            document.getElementById('home-page').classList.add('hidden');
            document.getElementById('quiz-page').classList.remove('hidden');
            document.getElementById('score-page').classList.add('hidden');
            document.getElementById('total-no').innerText = quizList.length;

            // 启动计时器
            startTimer();
            // 渲染第一题
            renderQuestion();
            // 模考显示交卷按钮
            document.getElementById('end-exam-btn').classList.toggle('hidden', !examMode);
        }

        // 随机抽取指定数量题目
        function randomPick(arr, num) {
            const copy = [...arr];
            copy.sort(() => Math.random() - 0.5);
            return copy.slice(0, num);
        }

        // 计时器
        function startTimer() {
            timerInterval = setInterval(() => {
                timeSecond++;
                const m = Math.floor(timeSecond / 60).toString().padStart(2,'0');
                const s = (timeSecond % 60).toString().padStart(2,'0');
                document.getElementById('timer').innerText = `${m}:${s}`;
            }, 1000);
        }

        // 渲染当前题目
        function renderQuestion() {
            const q = quizList[currentIndex];
            document.getElementById('current-no').innerText = currentIndex + 1;
            let typePrefix = "";
if (q['题型'] === '单选题') {
    typePrefix = "【单选题】";
} else if (q['题型'] === '多选题') {
    typePrefix = "【多选题】";
} else if (q['题型'] === '判断题') {
    typePrefix = "【判断题】";
}
// 拼接前缀+题目文字，用innerText避免样式
document.getElementById('question-text').innerText = typePrefix + q['试题正文'];
            // 清空选项
            const optBox = document.getElementById('options-box');
            optBox.innerHTML = '';
            // 分割选项 A/B/C/D
            const optArr = q['试题选项'].split('\n');
            optArr.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left p-3 border rounded-lg border-gray-300 bg-white';
                btn.innerText = opt;
                btn.dataset.val = opt[0]; // 存A/B/C/D
                btn.onclick = () => selectOption(btn, opt[0]);
                optBox.appendChild(btn);
            })
            // 重置界面状态
            document.getElementById('answer-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('submit-btn').classList.remove('hidden');
            userSelect = [];
            // ✅就在 userSelect = []; 的后面，插入这一行！！
    document.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('option-selected'));
        }

        // 选择选项（单选/多选兼容）
function selectOption(btn, val) {
    const q = quizList[currentIndex];
    // 单选只能选一个
    if(q['题型'] === '单选题' || q['题型'] === '判断题') {
        userSelect = [val];
        // 清除全部选中样式
        document.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('option-selected'));
        // 当前点击按钮加上蓝色选中
        btn.classList.add('option-selected');
    } else {
        // 多选可多选，点一下选中，再点取消
        if(userSelect.includes(val)) {
            userSelect = userSelect.filter(v=>v!==val);
            btn.classList.remove('option-selected');
        } else {
            userSelect.push(val);
            btn.classList.add('option-selected');
        }
    }
}

        // 提交答案判题
        function submitAnswer() {
            if(userSelect.length === 0) {
                alert('请先选择选项！');
                return;
            }
            const q = quizList[currentIndex];
            const rightAns = q['试题答案'].split('').sort().join('');
            const myAns = userSelect.sort().join('');
            const isRight = myAns === rightAns;

            // 给选项上色：正确绿，错误红
            document.querySelectorAll('.option-btn').forEach(btn=>{
                const v = btn.dataset.val;
                if(q['试题答案'].includes(v)) {
                    btn.classList.add('option-correct');
                } else if(userSelect.includes(v) && !q['试题答案'].includes(v)) {
                    btn.classList.add('option-error');
                }
                btn.disabled = true; // 提交后不可再选
            })

            // 模考统计正确数
            if(examMode && isRight) correctCount++;

            // 展示答案解析
            document.getElementById('real-answer').innerText = q['试题答案'];
            document.getElementById('explain-text').innerText = q['AI 解析'];
            document.getElementById('answer-box').classList.remove('hidden');
            // 切换按钮
            document.getElementById('submit-btn').classList.add('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
        }

        // 下一题
        function nextQuestion() {
            currentIndex++;
            if(currentIndex >= quizList.length) {
                if(examMode) {
                    endExam();
                } else {
                    alert('已完成全部题目！');
                    backHome();
                }
                return;
            }
            renderQuestion();
        }

        // 模考交卷出分
        function endExam() {
            clearInterval(timerInterval);
            document.getElementById('quiz-page').classList.add('hidden');
            document.getElementById('score-page').classList.remove('hidden');
            document.getElementById('final-score').innerText = correctCount;
            const m = Math.floor(timeSecond / 60).toString().padStart(2,'0');
            const s = (timeSecond % 60).toString().padStart(2,'0');
            document.getElementById('cost-time').innerText = `${m}分${s}秒`;
        }

        // 返回首页
        function backHome() {
            clearInterval(timerInterval);
            document.getElementById('home-page').classList.remove('hidden');
            document.getElementById('quiz-page').classList.add('hidden');
            document.getElementById('score-page').classList.add('hidden');
        }
    </script>
