<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 手机自适应关键标签 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>判断题-带解析</title>
    <!-- 引入Tailwind移动端样式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        right: '#22c55e',
                        wrong: '#ef4444',
                        primary: '#165dff'
                    }
                }
            }
        }
    </script>
    <style>
        .option-btn {
    transition: all 0.2s ease;
}
/* 点击选中立刻高亮蓝色 */
.option-selected{
    background-color:#165dff !important;
    color:#ffffff !important;
    border-color:#165dff !important;
}
.option-correct {
    background-color: #22c55e !important;
    color: white !important;
    border-color: #22c55e !important;
}
.option-error {
    background-color: #ef4444 !important;
    color: white !important;
    border-color: #ef4444 !important;
}
.hidden { display: none !important; }
.overview-item {
    padding: 0.5rem;
    border: 1px solid #d1d5db;
    border-radius: 0.5rem;
    text-align: center;
    cursor: pointer;
    background: white;
    font-size: 0.875rem;
}
.overview-item:hover { background: #f3f4f6; }
.overview-correct {
    background-color: #22c55e !important;
    border-color: #22c55e !important;
    color: white !important;
}
.overview-wrong {
    background-color: #ef4444 !important;
    border-color: #ef4444 !important;
    color: white !important;
}
.overview-current {
    box-shadow: 0 0 0 2px #165dff;
}
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-2xl mx-auto px-3 py-4">
        <!-- 首页选择模式 -->
        <div id="home-page" class="space-y-4 mt-10">
            <h1 class="text-2xl font-bold text-center text-primary mb-8">判断题-带解析</h1>
            <div class="grid gap-4">
                <button onclick="startMode('order')" class="w-full py-4 rounded-lg bg-primary text-white text-lg font-medium shadow-md">
                    模式1：顺序刷题（全部675题按顺序）
                </button>
                <button onclick="startMode('random100')" class="w-full py-4 rounded-lg bg-primary text-white text-lg font-medium shadow-md">
                    模式2：模拟考试（100道判断题，自动计分）
                </button>
            </div>
        </div>

        <!-- 刷题页面 -->
        <div id="quiz-page" class="hidden">
            <!-- 顶部计时栏 -->
            <div class="sticky top-0 bg-white shadow p-3 rounded-lg mb-4 flex justify-between items-center">
                <span id="mode-title" class="font-bold text-primary">刷题中</span>
                <span id="timer" class="text-red-500 font-mono text-lg">00:00</span>
            </div>
            <!-- 题号 -->
            <div class="text-gray-500 mb-2">第 <span id="current-no">1</span> / <span id="total-no">0</span> 题</div>
            <!-- 题干 -->
            <div class="bg-white rounded-lg p-4 shadow mb-4">
                <h2 id="question-text" class="text-base leading-relaxed"></h2>
            </div>
            <!-- 选项区域 -->
            <div id="options-box" class="space-y-3 mb-4"></div>
            <!-- 操作按钮 -->
            <div class="flex gap-3 mb-3">
                <button id="prev-btn" onclick="prevQuestion()" class="flex-1 py-3 rounded-lg bg-gray-200 text-gray-700 font-medium">上一题</button>
                <button id="submit-btn" onclick="submitAnswer()" class="flex-1 py-3 rounded-lg bg-primary text-white font-medium">确认答案</button>
                <button id="next-btn" onclick="nextQuestion()" class="flex-1 py-3 rounded-lg bg-gray-400 text-white font-medium hidden">下一题</button>
            </div>
            <button onclick="openOverview()" class="w-full py-3 rounded-lg bg-blue-50 text-primary font-medium border border-primary mb-4">题目总览</button>
            <!-- 答案解析区域（默认隐藏） -->
            <div id="answer-box" class="hidden bg-gray-50 border rounded-lg p-4 space-y-3">
                <div><span class="font-bold">正确答案：</span><span id="real-answer"></span></div>
                <div><span class="font-bold">解析：</span><p id="explain-text" class="text-gray-700 mt-1"></p></div>
            </div>
            <!-- 交卷按钮（仅模考模式显示） -->
            <button id="end-exam-btn" onclick="endExam()" class="w-full mt-4 py-3 rounded-lg bg-orange-500 text-white hidden">交卷出分</button>
            <!-- 返回首页 -->
            <button onclick="backHome()" class="w-full mt-4 py-3 rounded-lg bg-gray-200 text-gray-700">返回首页</button>
        </div>

        <!-- 题目总览弹窗 -->
        <div id="overview-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-lg w-full max-w-lg max-h-[80vh] overflow-auto p-4 shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-lg text-primary">题目总览</h3>
                    <button onclick="closeOverview()" class="text-2xl text-gray-400 leading-none">&times;</button>
                </div>
                <div id="overview-box" class="grid grid-cols-8 sm:grid-cols-10 gap-2"></div>
                <div class="mt-4 text-sm text-gray-500">
                    <span class="inline-block w-3 h-3 rounded bg-green-500 mr-1 align-middle"></span>答对
                    <span class="inline-block w-3 h-3 rounded bg-red-500 mr-1 ml-3 align-middle"></span>答错
                    <span class="inline-block w-3 h-3 rounded border border-gray-300 mr-1 ml-3 align-middle"></span>未做
                </div>
            </div>
        </div>

        <!-- 模考成绩页面 -->
        <div id="score-page" class="hidden mt-20 text-center">
            <h2 class="text-3xl font-bold text-primary mb-4">考试结束</h2>
            <div class="text-xl mb-2">总分：<span id="final-score" class="text-red-500 font-bold">0</span> / 100</div>
            <div class="text-gray-600 mb-8">用时：<span id="cost-time"></span></div>
            <button onclick="backHome()" class="px-8 py-3 rounded-lg bg-primary text-white">返回首页</button>
        </div>
    </div>

    <script>
        // 全局变量
        let allQuestions = []; // 全部题库
        let quizList = [];     // 当前刷题列表
        let currentIndex = 0;  // 当前题号
        let userSelect = [];   // 用户选择答案
        let timerInterval = null;
        let timeSecond = 0;
        let examMode = false;  // 是否是100题模考模式
        let correctCount = 0;  // 模考答对数量
        let answerRecord = {}; // 答题记录：index -> { userSelect, isDone, isRight }

        // 页面加载读取题库 tiku.json
        window.onload = function() {
            fetch('tiku.json')
                .then(res => res.json())
                .then(data => {
                    allQuestions = data;
                })
                .catch(() => alert('题库加载失败，请确认 tiku.json 文件存在'));
        }

        // 启动刷题模式
        function startMode(mode) {
            // 重置所有状态
            currentIndex = 0;
            timeSecond = 0;
            correctCount = 0;
            userSelect = [];
            answerRecord = {};
            examMode = false;
            clearInterval(timerInterval);
            quizList = [];

            if (allQuestions.length === 0) {
                alert('题库尚未加载完成，请稍后再试');
                return;
            }

            switch(mode) {
                case 'order':
                    quizList = [...allQuestions];
                    document.getElementById('mode-title').innerText = '顺序刷题';
                    break;
                case 'random100':
                    examMode = true;
                    document.getElementById('mode-title').innerText = '模拟考试（100题）';
                    quizList = randomPick(allQuestions, 100);
                    quizList.sort(() => Math.random() - 0.5);
                    break;
            }

            // 切换页面
            document.getElementById('home-page').classList.add('hidden');
            document.getElementById('quiz-page').classList.remove('hidden');
            document.getElementById('score-page').classList.add('hidden');
            document.getElementById('total-no').innerText = quizList.length;

            // 启动计时器
            startTimer();
            // 渲染第一题
            renderQuestion();
            // 模考显示交卷按钮
            document.getElementById('end-exam-btn').classList.toggle('hidden', !examMode);
        }

        // 随机抽取指定数量题目
        function randomPick(arr, num) {
            const copy = [...arr];
            copy.sort(() => Math.random() - 0.5);
            return copy.slice(0, num);
        }

        // 计时器
        function startTimer() {
            timerInterval = setInterval(() => {
                timeSecond++;
                const m = Math.floor(timeSecond / 60).toString().padStart(2,'0');
                const s = (timeSecond % 60).toString().padStart(2,'0');
                document.getElementById('timer').innerText = `${m}:${s}`;
            }, 1000);
        }

        // 渲染当前题目
        function renderQuestion() {
            const q = quizList[currentIndex];
            const record = answerRecord[currentIndex];

            document.getElementById('current-no').innerText = currentIndex + 1;
            document.getElementById('question-text').innerText = '【判断题】' + q['试题正文'];

            const optBox = document.getElementById('options-box');
            optBox.innerHTML = '';
            const optArr = q['试题选项'].split('\n');
            optArr.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left p-3 border rounded-lg border-gray-300 bg-white';
                btn.innerText = opt;
                btn.dataset.val = opt[0];
                btn.onclick = () => selectOption(btn, opt[0]);
                optBox.appendChild(btn);
            });

            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('prev-btn').classList.toggle('opacity-50', currentIndex === 0);

            if (record && record.isDone) {
                userSelect = [record.userSelect];
                applyOptionStyles(q, userSelect, true);
                document.getElementById('real-answer').innerText = q['试题答案'];
                document.getElementById('explain-text').innerText = q['AI 解析'];
                document.getElementById('answer-box').classList.remove('hidden');
                document.getElementById('submit-btn').classList.add('hidden');
                document.getElementById('next-btn').classList.remove('hidden');
            } else {
                userSelect = [];
                document.getElementById('answer-box').classList.add('hidden');
                document.getElementById('next-btn').classList.add('hidden');
                document.getElementById('submit-btn').classList.remove('hidden');
            }
        }

        // 给选项上色（提交后或回看已做题）
        function applyOptionStyles(q, selected, disabled) {
            document.querySelectorAll('.option-btn').forEach(btn => {
                const v = btn.dataset.val;
                btn.classList.remove('option-selected', 'option-correct', 'option-error');
                if (q['试题答案'].includes(v)) {
                    btn.classList.add('option-correct');
                } else if (selected.includes(v)) {
                    btn.classList.add('option-error');
                }
                if (selected.includes(v) && q['试题答案'].includes(v)) {
                    btn.classList.add('option-selected');
                }
                btn.disabled = disabled;
            });
        }

        // 选择选项（判断题单选，已做题不可再选）
        function selectOption(btn, val) {
            if (answerRecord[currentIndex]?.isDone) return;
            userSelect = [val];
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('option-selected'));
            btn.classList.add('option-selected');
        }

        // 提交答案判题
        function submitAnswer() {
            if (answerRecord[currentIndex]?.isDone) return;
            if (userSelect.length === 0) {
                alert('请先选择选项！');
                return;
            }
            const q = quizList[currentIndex];
            const isRight = userSelect[0] === q['试题答案'];

            answerRecord[currentIndex] = {
                userSelect: userSelect[0],
                isDone: true,
                isRight: isRight
            };

            applyOptionStyles(q, userSelect, true);

            document.getElementById('real-answer').innerText = q['试题答案'];
            document.getElementById('explain-text').innerText = q['AI 解析'];
            document.getElementById('answer-box').classList.remove('hidden');
            document.getElementById('submit-btn').classList.add('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
        }

        // 上一题
        function prevQuestion() {
            if (currentIndex <= 0) return;
            currentIndex--;
            renderQuestion();
        }

        // 下一题
        function nextQuestion() {
            currentIndex++;
            if(currentIndex >= quizList.length) {
                if(examMode) {
                    endExam();
                } else {
                    alert('已完成全部题目！');
                    backHome();
                }
                return;
            }
            renderQuestion();
        }

        // 题目总览
        function openOverview() {
            const box = document.getElementById('overview-box');
            box.innerHTML = '';
            for (let i = 0; i < quizList.length; i++) {
                const div = document.createElement('div');
                div.innerText = i + 1;
                div.className = 'overview-item';
                if (i === currentIndex) div.classList.add('overview-current');
                const rec = answerRecord[i];
                if (rec?.isDone) {
                    div.classList.add(rec.isRight ? 'overview-correct' : 'overview-wrong');
                }
                div.onclick = () => goToQuestion(i);
                box.appendChild(div);
            }
            document.getElementById('overview-modal').classList.remove('hidden');
        }

        function closeOverview() {
            document.getElementById('overview-modal').classList.add('hidden');
        }

        function goToQuestion(index) {
            currentIndex = index;
            renderQuestion();
            closeOverview();
        }

        // 模考交卷出分
        function endExam() {
            clearInterval(timerInterval);
            correctCount = Object.values(answerRecord).filter(r => r.isRight).length;
            document.getElementById('quiz-page').classList.add('hidden');
            document.getElementById('score-page').classList.remove('hidden');
            document.getElementById('final-score').innerText = correctCount;
            const m = Math.floor(timeSecond / 60).toString().padStart(2,'0');
            const s = (timeSecond % 60).toString().padStart(2,'0');
            document.getElementById('cost-time').innerText = `${m}分${s}秒`;
        }

        // 返回首页
        function backHome() {
            clearInterval(timerInterval);
            document.getElementById('home-page').classList.remove('hidden');
            document.getElementById('quiz-page').classList.add('hidden');
            document.getElementById('score-page').classList.add('hidden');
        }
    </script>
</body>
</html>
